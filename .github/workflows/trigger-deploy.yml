name: Trigger production build

# The framework repo does not build the image itself — a GHCR package is owned by
# the repository that first pushed it, so the pipeline lives in rtc-erp/erpnext.
# A push here asks that pipeline to rebuild (it always builds main of BOTH repos).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask rtc-erp/erpnext to build and deploy
        env:
          TOKEN: ${{ secrets.CI_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CI_DISPATCH_TOKEN is not set, so this push cannot start a deploy automatically."
            echo "Add a fine-grained PAT with 'Actions: read and write' on rtc-erp/erpnext as the"
            echo "CI_DISPATCH_TOKEN secret in this repository to enable it."
            echo "Until then, ship framework changes by running the 'Build and Deploy' workflow"
            echo "in rtc-erp/erpnext manually — it always builds main of both repos."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rtc-erp/erpnext/actions/workflows/build-deploy.yml/dispatches \
            -d '{"ref":"main"}'
          echo "requested build in rtc-erp/erpnext"
